name: Deploy Gate
# Runs the durable-artifacts gate on every PR and every push to main.
# A PR that drops GA4 / sitemap / popup function / brand casing / etc. goes RED here.
# To make RED actually BLOCK merges, the repo owner must enable branch protection on
# main requiring this "gate" check (Settings -> Branches -> Add rule).

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run durable-artifacts deploy gate
        run: bash scripts/deploy-gate.sh .
